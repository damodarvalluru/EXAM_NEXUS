env:
  contexts:
  - excludePaths:
    - .*/docs(?:/|\?|$).*
    - .*/health/live(?:\?|$).*
    - .*/health/ready(?:\?|$).*
    name: baseline
    urls:
    - http://host.docker.internal:3000
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: http://host.docker.internal:3000
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules:
