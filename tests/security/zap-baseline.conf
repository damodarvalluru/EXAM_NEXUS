# OWASP ZAP baseline rule configuration for ExamNexus.
# Format is TAB-SEPARATED: <rule-id><TAB><ACTION><TAB>(description). Do not replace tabs with spaces.
# Use with: zap-baseline.py -c tests/security/zap-baseline.conf -t http://localhost:3000
#
# This is a PASSIVE baseline only: it crawls and observes responses, it does not
# send attack payloads and it does not log in. Authenticated / tenant-specific
# scanning requires a ZAP context file (-n <context>.context, -U <user>) and a
# separate, explicitly authorised run. Generate that context from ZAP Desktop,
# keep credentials in environment variables, and never scan production without
# written authorisation.
#
# Noise exclusions (all rules, path-based, host-independent):
#   /docs          generated Swagger UI (review the OpenAPI document separately)
#   /health/live   liveness probe
#   /health/ready  readiness probe
*	OUTOFSCOPE	.*/docs(?:/|\?|$).*
*	OUTOFSCOPE	.*/health/live(?:\?|$).*
*	OUTOFSCOPE	.*/health/ready(?:\?|$).*
#
# Rule actions. FAIL makes the baseline exit non-zero; WARN is reported but does
# not gate; INFO/IGNORE suppress. Keep security-relevant rules at FAIL and triage
# every finding before downgrading anything in this file.
