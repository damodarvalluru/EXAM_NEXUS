name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @examnexus/shared build
      - name: Generate Prisma client
        run: pnpm --filter @examnexus/api prisma:generate
        env:
          DATABASE_URL: mysql://user:pass@localhost:3306/examnexus?sslaccept=strict
          DIRECT_URL: mysql://user:pass@localhost:3306/examnexus?sslaccept=strict
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
