name: Security verification

# Scheduled + manual only (no push/PR trigger).
# These jobs DETECT issues; they are NOT an independent security review and are not
# evidence that a penetration test passed. See docs/security/penetration-test-plan.md
# and docs/security/independent-review-checklist.md for the manual process.
# Actions are pinned to stable major/version tags; consider SHA pinning for your org.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Staging URL for the ZAP baseline (overrides TARGET_URL variable/secret)'
        required: false
        type: string
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC

permissions:
  contents: read

env:
  EVIDENCE_DIR: evidence/phase-08
  TARGET_URL: ${{ inputs.target_url || vars.TARGET_URL || secrets.TARGET_URL || 'http://localhost:3000' }}

jobs:
  semgrep:
    name: Semgrep source scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Semgrep with repository rules
        run: |
          mkdir -p "$EVIDENCE_DIR"
          semgrep scan --config tests/security/semgrep.yml --metrics=off \
            --exclude=node_modules --exclude=dist --exclude=.git --exclude=evidence \
            --sarif --output "$EVIDENCE_DIR/semgrep.sarif" \
            apps/backend/src apps/frontend/src packages/shared/src tests scripts
      - name: Upload Semgrep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-semgrep
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: warn

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare evidence directory
        run: mkdir -p "$EVIDENCE_DIR"
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: ${{ env.EVIDENCE_DIR }}/trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0' # informational; triage the SARIF rather than blocking the job
      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-trivy-fs
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: warn

  zap-baseline:
    name: ZAP baseline (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Baseline findings are triaged manually; never block the workflow on them.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare evidence directory
        run: mkdir -p "$EVIDENCE_DIR"
      - name: Run ZAP baseline against configured target
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.TARGET_URL }}
          rules_file_name: tests/security/zap-baseline.conf
          allow_issue_writing: 'false'
          fail_action: 'false'
          artifact_name: zap-baseline-report
          cmd_options: >-
            -r ${{ env.EVIDENCE_DIR }}/zap-baseline.html
            -J ${{ env.EVIDENCE_DIR }}/zap-baseline.json
      - name: Upload ZAP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-zap-baseline
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: warn
