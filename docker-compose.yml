# ExamNexus uses TiDB Cloud (MySQL-compatible) as its database — no local DB container.
# Set DATABASE_URL / DIRECT_URL in .env and apps/api/.env (see .env.example).
services:
  redis:
    image: redis:7-alpine
    container_name: examnexus-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: not needed for Phases 2-3. Enable with: docker compose --profile optional up -d
  minio:
    profiles: ["optional"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: examnexus-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-examnexus_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-examnexus_dev_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  createbuckets:
    profiles: ["optional"]
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-examnexus_dev} ${S3_SECRET_ACCESS_KEY:-examnexus_dev_secret}; do sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-examnexus};
      exit 0;
      "

  # Optional: SMTP catcher; no mail provider is wired in Phases 2-3.
  mailhog:
    profiles: ["optional"]
    image: mailhog/mailhog:v1.0.1
    container_name: examnexus-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  redisdata:
  miniodata:
